<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:1500px;font-family:Montserrat,sans-serif;color:#111;overflow:hidden}
.poster{position:relative;width:1200px;height:1500px;background:
 radial-gradient(ellipse at 50% 48%,#fff 0%,#f4f5f8 55%,#e9ebf0 100%);overflow:hidden}
.waves{position:absolute;inset:0;opacity:.55;background:
 repeating-linear-gradient(135deg,transparent 0 38px,rgba(255,255,255,.9) 38px 40px,transparent 40px 80px)}
.top{position:absolute;top:40px;left:50px;right:50px;display:flex;justify-content:space-between;align-items:flex-start}
.logo{width:250px;mix-blend-mode:multiply}
.social{display:flex;gap:16px}
.social span{width:62px;height:62px;border-radius:50%;background:#d7262b;display:flex;align-items:center;justify-content:center}
.title{position:absolute;top:175px;width:100%;text-align:center}
.brand{display:inline-flex;align-items:center;gap:26px}
.hp{width:96px;height:96px;border-radius:50%;background:#0a63b8;color:#fff;font-weight:800;font-style:italic;font-size:54px;display:flex;align-items:center;justify-content:center;letter-spacing:-2px}
.model{font-size:92px;font-weight:900;letter-spacing:-1px}
.badge{display:inline-block;margin-top:14px;background:#d7262b;color:#fff;font-weight:800;font-size:34px;padding:10px 34px;border-radius:10px;letter-spacing:.5px}
.sub{margin-top:14px;font-size:30px;font-weight:500;color:#333}
.product{position:absolute;top:455px;left:50%;transform:translateX(-50%);width:620px;mix-blend-mode:multiply}
.shadow{position:absolute;top:1045px;left:50%;transform:translateX(-50%);width:600px;height:40px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.18),transparent 70%)}
.dots{position:absolute;display:grid;grid-template-columns:repeat(2,14px);gap:12px}
.dots i{width:12px;height:12px;border-radius:50%;background:#d7262b}
.dots.g i{background:#9aa0aa}
.tiles{position:absolute;top:1090px;left:50px;right:50px;display:flex;gap:18px}
.tile{flex:1;height:160px;background:#fff;border:1.5px solid #e1e3e8;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;font-size:19px;font-weight:600;line-height:1.2}
.tile svg{width:52px;height:52px}
.price{position:absolute;top:1282px;left:0;display:flex;align-items:stretch;height:96px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.price .l{background:#d7262b;color:#fff;font-weight:900;font-style:italic;font-size:44px;padding:0 34px 0 50px;display:flex;align-items:center;clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
.price .r{background:#111;color:#fff;margin-left:-26px;padding:0 40px 0 46px;display:flex;align-items:center;gap:10px;border-radius:0 14px 14px 0;clip-path:polygon(7% 0,100% 0,100% 100%,0 100%)}
.price .r b{font-size:62px;font-weight:900}
.price .r small{font-size:22px;font-weight:800;align-self:flex-start;margin-top:20px}
.guar{position:absolute;top:1290px;right:50px;text-align:right;font-weight:700;font-size:22px;color:#333;line-height:1.5}
.guar em{font-style:normal;color:#d7262b}
.contact{position:absolute;bottom:26px;left:50px;right:50px;display:flex;align-items:center;gap:22px}
.contact .ic{width:66px;height:66px;background:#d7262b;border-radius:14px;display:flex;align-items:center;justify-content:center}
.contact .num{font-size:40px;font-weight:800;letter-spacing:.5px}
.contact .sep{font-size:40px;color:#999}
.contact .web{margin-left:auto;font-size:24px;font-weight:700;color:#d7262b}
</style></head><body>
<div class="poster">
 <div class="waves"></div>
 <div class="top">
  <div><img class="logo" src="logo-dispo.png"></div>
  <div class="social">
   <span><svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M14 8h3V4h-3c-2.8 0-4 1.8-4 4.3V10H7v4h3v8h4v-8h3l1-4h-4V8.6c0-.4.2-.6.6-.6z"/></svg></span>
   <span><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg></span>
  </div>
 </div>

 <div class="title">
  <div class="brand"><div class="hp">hp</div><div class="model">LaserJet 4303fdw</div></div><br>
  <div class="badge">IMPRIMANTE MULTIFONCTION LASER COULEUR</div>
  <div class="sub">HP Color LaserJet Pro MFP 4303fdw</div>
 </div>

 <div class="dots" style="top:520px;left:70px"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
 <div class="dots g" style="top:760px;right:70px"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

 <div class="shadow"></div>
 <img class="product" src="hp-4303fdw.png">

 <div class="tiles">
  <div class="tile"><svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="26" r="16"/><path d="M24 26l8-8M24 6v4M20 6h8"/><path d="M14 26h2M32 26h2M24 36v2"/></svg>Jusqu'à 33 ppm<br>A4</div>
  <div class="tile"><svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round"><rect x="8" y="18" width="32" height="16" rx="3"/><path d="M14 18V6h20v12M14 30h20v12H14z"/><circle cx="35" cy="24" r="1.5" fill="#d7262b" stroke="none"/></svg>Impression, Copie,<br>Scan &amp; Fax</div>
  <div class="tile"><svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><path d="M8 18a23 23 0 0 1 32 0M13 24a16 16 0 0 1 22 0M18 30a9 9 0 0 1 12 0"/><circle cx="24" cy="37" r="2.5" fill="#d7262b" stroke="none"/></svg>Wi-Fi, Ethernet<br>&amp; USB</div>
  <div class="tile"><svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round"><path d="M12 6h18l8 8v28H12z"/><path d="M30 6v8h8"/><path d="M18 24h14M18 30h14" stroke-linecap="round"/><path d="M6 20v14" stroke="#d7262b" stroke-linecap="round"/></svg>Recto-verso<br>automatique</div>
  <div class="tile"><svg viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round"><rect x="6" y="8" width="36" height="24" rx="3"/><path d="M26 22v14l3-3 3 6 3-1-3-6h4z" fill="#d7262b" stroke="#111" stroke-width="1.8"/></svg>Écran tactile<br>couleur 4,3"</div>
 </div>

 <div class="price"><div class="l">PRIX :</div><div class="r"><b>XXX.XXX</b><small>FCFA</small></div></div>

 <div class="contact">
  <div class="ic"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></div>
  <div class="num">78 012 11 10</div><div class="sep">/</div><div class="num">78 829 51 51</div>
  <div class="web">www.dispo.sn</div>
 </div>
</div>
</body></html>
