<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Dispo HP 4303 Nuit</title>
<link rel="stylesheet" href="affiche.css"><style>
.poster{color:#fff;background:radial-gradient(70% 45% at 50% 48%,#7a0a14 0%,#3a0610 45%,#12050a 80%,#0a0306 100%)}
.lines{position:absolute;inset:-20mm;background:repeating-linear-gradient(100deg,transparent 0 9mm,rgba(255,60,80,.16) 9mm 9.25mm,transparent 9.25mm 15mm,rgba(255,255,255,.05) 15mm 15.2mm);mask-image:radial-gradient(70% 60% at 50% 45%,#000 30%,transparent 85%)}
.glow{position:absolute;top:120mm;left:50%;width:170mm;height:60mm;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(227,6,19,.55),transparent 70%);filter:blur(4mm)}
.hp{position:absolute;top:14mm;left:14mm;width:20mm}
.dispo{position:absolute;top:13mm;right:13mm;background:#fff;border-radius:3.5mm;padding:3mm 4.5mm;box-shadow:0 0 10mm rgba(227,6,19,.45)}
.dispo img{height:11mm;display:block}
.head{position:absolute;top:44mm;width:100%;text-align:center}
.head h1{font-size:15mm;font-weight:900;letter-spacing:-.4mm;line-height:1}
.head .sub{display:inline-flex;align-items:center;gap:4mm;margin-top:4mm;font-size:7.6mm;font-weight:400}
.head .sub b{border:1.6px solid #fff;border-radius:2.5mm;padding:.6mm 4mm;font-weight:600}
.printer{position:absolute;top:84mm;left:50%;width:140mm;transform:translateX(-50%)}
.reflect{position:absolute;top:214mm;left:50%;width:140mm;height:30mm;transform:translateX(-50%) scaleY(-1);object-fit:cover;object-position:bottom;opacity:.22;mask-image:linear-gradient(0deg,#000,transparent 70%)}
.floor{position:absolute;top:208mm;left:50%;width:150mm;height:10mm;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.7),transparent 70%)}
.feats{position:absolute;top:231mm;left:10mm;right:10mm;display:flex;justify-content:space-between;align-items:center}
.f{display:flex;align-items:center;gap:2.3mm;font-size:3.5mm;line-height:1.3;font-weight:400}
.f .i{width:9mm;height:9mm;flex:none}
.sep{width:1px;height:10mm;background:rgba(255,255,255,.55)}
.contact{position:absolute;left:12mm;right:12mm;bottom:12mm;border:1.4px solid rgba(255,255,255,.85);border-radius:4mm;padding:4.5mm 5mm;text-align:center;background:rgba(0,0,0,.25)}
.contact .r{display:flex;justify-content:center;align-items:center;gap:7mm;font-size:5mm;font-weight:600}
.contact .r span{display:flex;align-items:center;gap:2mm}
.contact .r .i{width:5mm;height:5mm;color:#ff4d5a}
.contact hr{border:0;height:1px;width:70%;margin:3mm auto;background:rgba(255,255,255,.5)}
.contact .web{font-size:6.2mm;font-weight:800}
.contact .addr{font-size:4.1mm;font-weight:500}
.stripe{position:absolute;left:0;right:0;bottom:0;height:2.5mm;background:var(--red)}
</style></head><body><div class="poster">
<div class="lines"></div><div class="glow"></div>
<img class="hp" src="images/logo-hp.svg" alt="HP">
<div class="dispo"><img src="images/logo-dispo.png" alt="Dispo"></div>
<div class="head"><h1>HP Color LaserJet Pro</h1><div class="sub">Multifonction <b>MFP 4303</b></div></div>
<div class="floor"></div>
<img class="printer" src="images/hp-4303.png" alt="HP Color LaserJet Pro MFP 4303">
<img class="reflect" src="images/hp-4303.png" alt="">
<div class="feats">
 <div class="f"><span class="i"><i data-i="color"></i></span>Laser<br>couleur</div><div class="sep"></div>
 <div class="f"><span class="i"><i data-i="speed"></i></span>Jusqu’à<br>33 ppm</div><div class="sep"></div>
 <div class="f"><span class="i"><i data-i="duplex"></i></span>Recto-verso<br>automatique</div><div class="sep"></div>
 <div class="f"><span class="i"><i data-i="wifi"></i></span>Wi-Fi &amp;<br>Ethernet</div><div class="sep"></div>
 <div class="f"><span class="i"><i data-i="scan"></i></span>Imprime, copie<br>&amp; scanne</div>
</div>
<div class="contact">
 <div class="r"><span><span class="i"><i data-i="phone"></i></span>78 012 11 10</span><span><span class="i"><i data-i="phone"></i></span>77 661 09 23</span><span class="web"><span class="i"><i data-i="web"></i></span>dispo.sn</span></div>
 <hr><div class="r addr"><span><span class="i"><i data-i="pin"></i></span>Boutique : Médina, Rue 37 × Avenue Blaise Diagne, Dakar</span></div>
</div>
<div class="stripe"></div>
</div><script src="icons.js"></script></body></html>
