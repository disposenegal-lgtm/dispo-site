<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Dispo HP 4303 Epure</title>
<link rel="stylesheet" href="affiche.css"><style>
.poster{color:#141820;background:linear-gradient(180deg,#ffffff 0%,#f2f4f7 100%)}
.waves{position:absolute;inset:0;background:repeating-linear-gradient(125deg,transparent 0 6mm,rgba(20,30,50,.035) 6mm 7mm),repeating-linear-gradient(60deg,transparent 0 11mm,rgba(20,30,50,.025) 11mm 12mm);mask-image:linear-gradient(180deg,transparent 15%,#000 60%)}
.hp{position:absolute;top:15mm;left:14mm;width:19mm}
.dispo{position:absolute;top:15mm;right:14mm;height:13mm}
.head{position:absolute;top:44mm;width:100%;text-align:center}
.head .brand{display:inline-flex;align-items:center;gap:4mm}
.head h1{font-size:12.5mm;font-weight:900;color:var(--hpblue);letter-spacing:-.3mm}
.head .pill{border:1.6px solid #141820;border-radius:2.5mm;padding:.8mm 4mm;font-size:6.5mm;font-weight:600}
.head .sub{margin-top:2.5mm;font-size:9mm;font-weight:500;letter-spacing:-.2mm}
.printer{position:absolute;top:80mm;left:50%;width:132mm;transform:translateX(-50%);filter:drop-shadow(0 4mm 5mm rgba(0,0,0,.22))}
.floor{position:absolute;top:197mm;left:50%;width:150mm;height:9mm;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.28),transparent 70%)}
.cards{position:absolute;top:212mm;left:12mm;right:12mm;display:grid;grid-template-columns:repeat(5,1fr);gap:3mm}
.card{background:#fff;border:1px solid #dfe3ea;border-radius:3mm;padding:3.5mm 1.5mm 3mm;text-align:center;font-size:3.2mm;line-height:1.3;box-shadow:0 1.5mm 4mm rgba(20,30,50,.08)}
.card .i{width:10mm;height:10mm;margin:0 auto 2mm;color:#141820}
.card .i.r{color:var(--red)}
.contact{position:absolute;left:12mm;right:12mm;bottom:11mm;border:1.4px solid #141820;border-radius:4mm;padding:4mm 5mm;text-align:center;background:#fff}
.contact .r{display:flex;justify-content:center;align-items:center;gap:7mm;font-size:5mm;font-weight:600}
.contact .r span{display:flex;align-items:center;gap:2mm}
.contact .r .i{width:5mm;height:5mm;color:var(--red)}
.contact hr{border:0;height:1px;width:70%;margin:2.6mm auto;background:#141820;opacity:.6}
.contact .web{font-size:6.2mm;font-weight:800;color:var(--red)}
.contact .addr{font-size:4.1mm;font-weight:500}
.avail{position:absolute;top:250mm;width:100%;text-align:center;font-size:4mm;font-weight:700;letter-spacing:1.2mm}
.avail span{color:var(--red)}
</style></head><body><div class="poster">
<div class="waves"></div>
<img class="hp" src="images/logo-hp.svg" alt="HP">
<img class="dispo" src="images/logo-dispo.png" alt="Dispo">
<div class="head"><div class="brand"><h1>HP</h1><span class="pill">MFP 4303</span></div><div class="sub">Color LaserJet Pro</div></div>
<div class="floor"></div>
<img class="printer" src="images/hp-4303.png" alt="HP Color LaserJet Pro MFP 4303">
<div class="cards">
 <div class="card"><div class="i r"><i data-i="speed"></i></div>Jusqu’à 33 ppm</div>
 <div class="card"><div class="i"><i data-i="duplex"></i></div>Recto-verso automatique</div>
 <div class="card"><div class="i r"><i data-i="wifi"></i></div>Wi-Fi, Ethernet &amp; USB</div>
 <div class="card"><div class="i"><i data-i="touch"></i></div>Écran tactile couleur</div>
 <div class="card"><div class="i r"><i data-i="print"></i></div>Imprime, scanne &amp; copie</div>
</div>
<div class="avail">DISPONIBLE MAINTENANT CHEZ <span>DISPO</span></div>
<div class="contact">
 <div class="r"><span><span class="i"><i data-i="phone"></i></span>78 012 11 10</span><span><span class="i"><i data-i="phone"></i></span>77 661 09 23</span><span class="web"><span class="i"><i data-i="web"></i></span>dispo.sn</span></div>
 <hr><div class="r addr"><span><span class="i"><i data-i="pin"></i></span>Boutique : Médina, Rue 37 × Avenue Blaise Diagne, Dakar</span></div>
</div>
</div><script src="icons.js"></script></body></html>
